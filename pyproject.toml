[project]
name = "lutris-antispam"
version = "0.2.0"
description = "Closed-source submission-scoring rules for the Lutris website"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lutris_antispam"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
